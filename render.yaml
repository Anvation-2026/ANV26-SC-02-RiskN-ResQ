# One-click deploy on Render (https://render.com): Dashboard → New → Blueprint → pick this repository.
# It creates three things: the FastAPI backend (Docker), a managed PostgreSQL database, and the web app (static site).
# Secrets marked sync:false are typed into the Render dashboard when the blueprint is applied; they are never stored in git.
# The backend and the web app reach each other by their public onrender.com addresses (set below). If Render gives a service a
# different address (for example a suffix because the name is taken), change EXPO_PUBLIC_API_URL and CORS_ORIGINS to match.
databases:
  - name: riskn-db
    plan: free
    databaseName: risknresq
services:
  # ---------------------------------------------------------------- backend API (FastAPI + background data jobs)
  - type: web
    name: riskn-resq-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: riskn-db, property: connectionString }
      - key: ADMIN_EMAIL           # the Super Admin account created on first start
        sync: false
      - key: ADMIN_PASSWORD        # at least 8 characters; only ever stored hashed
        sync: false
      - key: ADMIN_NAME
        value: Super Admin
      - key: CORS_ORIGINS          # the web app's PUBLIC address (fromService "host" is Render's internal name, which browsers cannot reach)
        value: https://riskn-resq-web.onrender.com
      - key: TRUST_PROXY
        value: "1"
      - key: DEMO_DATA             # never seed sample data in a real deployment
        value: "false"
      - key: CLOUDINARY_URL        # strongly recommended: the server's own disk is wiped on every redeploy
        sync: false
      - key: SMTP_HOST             # email codes (login code, password reset); without SMTP they only reach the server log
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID    # optional SMS / WhatsApp alerts
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: GEMINI_API_KEY        # optional: RiskN AI wording through Gemini (the grounded engine works without any key)
        sync: false
      - key: OPENAI_API_KEY        # optional alternative to Gemini
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: SENTRY_DSN            # optional error reporting
        sync: false

  # ---------------------------------------------------------------- web app (Expo web export, served as a static site)
  - type: web
    name: riskn-resq-web
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    routes:
      - type: rewrite              # single-page app: every path serves index.html
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION          # Expo SDK 57 needs Node 20 or newer
        value: "22"
      - key: EXPO_PUBLIC_API_URL   # baked into the web build: the backend's PUBLIC address (not Render's internal host name)
        value: https://riskn-resq-api.onrender.com
